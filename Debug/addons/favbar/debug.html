<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>FavBar Debug Log</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 12px/1.5 Consolas, 'Courier New', monospace; background: #1e1e1e; color: #d4d4d4; display: flex; flex-direction: column; height: 100vh; }
#toolbar { background: #2d2d2d; padding: 4px 8px; border-bottom: 1px solid #444; display: flex; gap: 6px; align-items: center; }
#toolbar button { font: 11px sans-serif; padding: 2px 10px; cursor: pointer; background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; }
#toolbar button:hover { background: #505050; }
#toolbar label { font: 11px sans-serif; color: #aaa; margin-left: auto; }
#toolbar input[type=checkbox] { margin-right: 3px; }
#log { flex: 1; overflow-y: auto; padding: 4px 8px; white-space: pre; }
.line { padding: 1px 0; border-bottom: 1px solid #2a2a2a; }
.line .ts { color: #888; }
.line .sync { color: #569cd6; }
.line .ui { color: #6a9955; }
</style>
</head>
<body>
<div id="toolbar">
  <button onclick="refresh()">새로고침</button>
  <button onclick="clearLog()">초기화</button>
  <button onclick="copyLog()">복사</button>
  <label><input type="checkbox" id="chkAuto" checked>자동 새로고침</label>
</div>
<div id="log"></div>
<script>
var opener_ = null;
var timer_ = null;

function init() {
  try {
    opener_ = window.dialogArguments || (window.opener && window.opener.Addons ? window.opener : null);
  } catch(e) {}
  refresh();
  startAuto();
  document.getElementById('chkAuto').onchange = function () {
    if (this.checked) startAuto(); else stopAuto();
  };
}

function startAuto() {
  stopAuto();
  timer_ = setInterval(refresh, 500);
}

function stopAuto() {
  if (timer_) { clearInterval(timer_); timer_ = null; }
}

function refresh() {
  var el = document.getElementById('log');
  var logs = [];
  try {
    if (opener_ && opener_.Addons && opener_.Addons.FavBar) {
      logs = opener_.Addons.FavBar._logs || [];
    }
  } catch(e) {
    el.textContent = '(opener 접근 불가: ' + e.message + ')';
    return;
  }
  var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 10;
  var html = [];
  for (var i = 0; i < logs.length; i++) {
    var line = logs[i];
    var cls = line.indexOf('[FavBar:sync]') >= 0 ? 'sync' : 'ui';
    var tsEnd = line.indexOf(' [');
    var ts = tsEnd > 0 ? line.substring(0, tsEnd) : '';
    var msg = tsEnd > 0 ? line.substring(tsEnd + 1) : line;
    html.push('<div class="line"><span class="ts">' + esc(ts) + '</span> <span class="' + cls + '">' + esc(msg) + '</span></div>');
  }
  el.innerHTML = html.length ? html.join('') : '<div class="line" style="color:#888">(로그 없음 - 디버그 모드를 켜세요)</div>';
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function clearLog() {
  try {
    if (opener_ && opener_.Addons && opener_.Addons.FavBar) {
      opener_.Addons.FavBar._logs = [];
    }
  } catch(e) {}
  refresh();
}

function copyLog() {
  var logs = [];
  try {
    if (opener_ && opener_.Addons && opener_.Addons.FavBar) {
      logs = opener_.Addons.FavBar._logs || [];
    }
  } catch(e) {}
  var text = logs.join('\n');
  if (window.clipboardData) {
    window.clipboardData.setData('Text', text);
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
